version: '3.8'

services:
  api:
    build: .
    container_name: support-copilot-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=dev
    volumes:
      # Mount source code for hot reload in development
      - ./app:/app/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health/live', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
